<text x="76" y="72" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2" fill="#7a2e3a" text-anchor="start">CODEBASE DOSSIER · WEEK 2 PROJECT</text>
<text x="58" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#171a1f" text-anchor="start">GraphRAG Dossier</text>
<text x="60" y="178" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#454b54" text-anchor="start">Two retrieval arms — hybrid vector-RAG and GraphRAG — run over the same corpus and are compared</text>
<text x="60" y="205" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#454b54" text-anchor="start">head-to-head, orchestrated by a LangGraph state machine with a refuse-vs-generate confidence gate.</text>
