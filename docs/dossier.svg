<text x="78" y="1078" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#171a1f" text-anchor="start">Exhibit A — Entry &amp; Orchestration (app/)</text>
<text x="78" y="1102" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">Home.py</text>
<text x="92" y="1122" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">The Streamlit chat UI — the only query surface. No retrieval logic of its own.</text>
<text x="78" y="1151" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">graph_flow.py</text>
<text x="92" y="1171" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Builds the LangGraph state machine wiring both arms + the confidence gate.</text>
<text x="78" y="1200" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">common/config.py</text>
<text x="92" y="1220" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Central project-wide settings — models, chunk sizes, top-k, thresholds.</text>
<rect x="812.0" y="1054" width="728.0" height="458" rx="4" fill="#f8f9f8" stroke="#c9cdc9"/>
<text x="830.0" y="1078" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#171a1f" text-anchor="start">Exhibit B — Core Pipeline (app/core/)</text>
<text x="830.0" y="1102" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">ingestion.py</text>
<text x="844.0" y="1122" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Pulls PRs/issues/RFCs from the GitHub API, keeps structured metadata for the graph.</text>
<text x="830.0" y="1151" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">chunking.py</text>
<text x="844.0" y="1171" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Splits corpus text sized to the embedding model's capacity; code chunked separately.</text>
<text x="830.0" y="1200" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">vector_store.py</text>
<text x="844.0" y="1220" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">HybridVectorStore — dense embeddings fused with BM25 via reciprocal rank fusion.</text>
<text x="830.0" y="1249" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">retrieval_vector.py</text>
<text x="844.0" y="1269" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Hybrid retrieve → cross-encoder rerank → top-5 chunks (the vector-RAG arm).</text>
<text x="830.0" y="1298" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">graph_build.py</text>
<text x="844.0" y="1318" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Extracts entities/relationships (contributors, PRs, modules, skills) into a GraphStore.</text>
<text x="830.0" y="1347" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">retrieval_graph.py</text>
<text x="844.0" y="1367" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Entity match → 1-2 hop traversal → serialized subgraph (the GraphRAG arm).</text>
<text x="830.0" y="1396" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">confidence_gate.py</text>
<text x="844.0" y="1416" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">should_refuse() — a real graph branch, designed before the happy path.</text>
<text x="830.0" y="1445" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">generation.py</text>
<text x="844.0" y="1465" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Calls Claude with retrieved context to produce a grounded, cited answer.</text>
<rect x="60" y="1287" width="728.0" height="311" rx="4" fill="#f8f9f8" stroke="#c9cdc9"/>
<text x="78" y="1311" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#171a1f" text-anchor="start">Exhibit C — Evaluation</text>
<text x="78" y="1335" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">evaluation.py</text>
<text x="92" y="1355" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Hand-rolled LLM-judge: faithfulness, relevance, refusal-rate, latency on 16 queries.</text>
<text x="78" y="1384" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">checkpoints.py</text>
<text x="92" y="1404" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Fast per-stage sanity checks, each modeled on a real bug found the hard way.</text>
<text x="78" y="1433" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">ragas_eval.py</text>
<text x="92" y="1453" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">ragas Faithfulness + LLMContextPrecisionWithoutReference — an independent cross-check.</text>
<text x="78" y="1482" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">scripts/run_eval.py</text>
<text x="92" y="1502" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Builds both stores, runs the full comparison, writes results.json.</text>
<text x="78" y="1531" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">scripts/run_ragas_eval.py</text>
<text x="92" y="1551" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Same build, scored with ragas instead; writes ragas_results.json.</text>
<rect x="812.0" y="1532" width="728.0" height="311" rx="4" fill="#f8f9f8" stroke="#c9cdc9"/>
<text x="830.0" y="1556" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#171a1f" text-anchor="start">Exhibit D — Data &amp; Documentation</text>
<text x="830.0" y="1580" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">data/corpus/raw/</text>
<text x="844.0" y="1600" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Real GitHub data (langchain-ai/langchain) — 500 PRs + 500 issues/RFCs.</text>
<text x="830.0" y="1629" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">data/eval/test_queries.json</text>
<text x="844.0" y="1649" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">The 16-query comparison set (10 original + 6 edge cases).</text>
<text x="830.0" y="1678" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">docs/PLAN.md</text>
<text x="844.0" y="1698" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Full architecture + eval plan — the source of truth other docstrings cite.</text>
<text x="830.0" y="1727" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">docs/EVAL_RESULTS.md</text>
<text x="844.0" y="1747" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">The full investigation log — every bug found, root cause, and fix.</text>
<text x="830.0" y="1776" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">docs/PROJECT_WRITEUP.md</text>
<text x="844.0" y="1796" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">The submission write-up, incl. the head-to-head comparison summary.</text>
<line x1="60" y1="1883" x2="1540" y2="1883" stroke="#c9cdc9"/>
<text x="60" y="1917" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#171a1f" text-anchor="start">Why hybrid, not pure dense</text>
<circle cx="66" cy="1938" r="4.5" fill="#7a2e3a"/>
<text x="82" y="1943" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#454b54" text-anchor="start">Dense retrieval catches paraphrase / semantic intent, misses exact identifiers (PR numbers, usernames, error</text>
<text x="82" y="1962" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#454b54" text-anchor="start">codes).</text>
<circle cx="66" cy="1984" r="4.5" fill="#7a2e3a"/>
<text x="82" y="1989" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#454b54" text-anchor="start">BM25 catches those exact identifiers, misses semantic intent. Fuse both, then rerank the merged top ~20 down</text>
<text x="82" y="2008" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#454b54" text-anchor="start">to 5.</text>
<circle cx="66" cy="2030" r="4.5" fill="#7a2e3a"/>
<text x="82" y="2035" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#454b54" text-anchor="start">A RAG app that hallucinates when retrieval comes up empty is worse than one that says it doesn't know — the</text>
<text x="82" y="2054" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#454b54" text-anchor="start">refusal path was designed before the happy path.</text>
<line x1="60" y1="2093" x2="1540" y2="2093" stroke="#c9cdc9"/>
<text x="60" y="2119" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#454b54" text-anchor="start">GraphRAG for Organizational Knowledge · Week 2 Project</text>
