<text x="60" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#171a1f" text-anchor="start">Two Arms, One Corpus</text>
<text x="60" y="436" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#454b54" text-anchor="start">Both arms run in parallel on every query — a shared confidence gate, not either arm alone, decides whether to answer or refuse.</text>
