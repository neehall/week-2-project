<text x="570" y="288" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="26" fill="#7a2e3a" text-anchor="start">6</text>
<text x="570" y="308" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" letter-spacing="1" fill="#454b54" text-anchor="start">EVAL METRICS</text>
